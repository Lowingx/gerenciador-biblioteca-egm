name: GBE - Tarefas Diárias
on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:
permissions:
  issues: read
jobs:
  daily-assigned:
    runs-on: ubuntu-latest
    steps:
      - name: GBE Task Dispatcher Ultra
        uses: actions/github-script@v7
        env:
          DISCORD_FRONTEND: ${{ secrets.DISCORD_FRONTEND }}
          DISCORD_BACKEND: ${{ secrets.DISCORD_BACKEND }}
          DISCORD_BANCO: ${{ secrets.DISCORD_BANCO }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const discordMap = {
              "Lowingx": "705925658861371394",
              "gdTech1": "1416271217727377540",
              "IcaroLuizz": "693541367233773608",
              "mig1z": "783069888041975898",
              "XxXCrossFakeXxX": "609040036863803415"
            };
            const build = (title, color, tasks) => {
              if (tasks.length === 0) return { embeds: [{ title: `${title} ✅`, description: "Tudo limpo! Nenhuma tarefa pendente.", color }] };
              const pings = [...new Set(tasks.flatMap(i => i.assignees.map(a => discordMap[a.login] ? `<@${discordMap[a.login]}>` : '')))].filter(Boolean).join(' ');
              const desc = tasks.sort((a, b) => new Date(a.created_at) - new Date(b.created_at)).map(i => {
                const users = i.assignees.map(a => discordMap[a.login] ? `<@${discordMap[a.login]}>` : `@${a.login}`).join(' ');
                const timestamp = Math.floor(new Date(i.created_at).getTime() / 1000);
                return `**[#${i.number}]** [${i.title}](${i.html_url})\n> 👤 ${users} • ⏳ <t:${timestamp}:R>`;
              }).join('\n\n');
              return { content: pings || null, embeds: [{ title: `${title} 🎯 (${tasks.length})`, description: desc, color }] };
            };
            const send = async (url, data) => {
              if (!url) return;
              await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
            };
            const getTasks = (reg) => issues.filter(i => i.assignees?.length && i.labels.some(l => reg.test(l.name.toLowerCase())));
            await send(process.env.DISCORD_FRONTEND, build("🚀 Frontend Interface", 7030464, getTasks(/front|interface|ui|ux/)));
            await send(process.env.DISCORD_BACKEND, build("🔧 Backend Core", 46296, getTasks(/back|core|api|server/)));
            await send(process.env.DISCORD_BANCO, build("🗄️ Banco de Dados", 6809849, getTasks(/banco|db|dados|database/)));
