name: GBE - Tarefas Atribuídas por Membro (Diário)

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  issues: read

jobs:
  daily-assigned:
    runs-on: ubuntu-latest
    steps:
      - name: Enviar tarefas atribuídas por time
        uses: actions/github-script@v7
        env:
          DISCORD_FRONTEND: ${{ secrets.DISCORD_FRONTEND }}
          DISCORD_BACKEND: ${{ secrets.DISCORD_BACKEND }}
          DISCORD_BANCO: ${{ secrets.DISCORD_BANCO }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
              sort: 'updated',
              direction: 'desc'
            });

            const discordMap = {
              "Lowingx": "1416271217727377540",
              "gdTech1": "1416271217727377540",
              "IcaroLuizz": "693541367233773608",
              "mig1z": "783069888041975898",
              "XxXCrossFakeXxX": "609040036863803415"
            };

            const createPayload = (emoji, title, tasks) => {
              if (tasks.length === 0) {
                return { embeds: [{ title: `${emoji} ${title}`, description: "Nenhuma tarefa atribuída.", color: 11184810 }] };
              }

              const pings = [...new Set(tasks.flatMap(i => i.assignees.map(a => discordMap[a.login] ? `<@${discordMap[a.login]}>` : '')))].filter(Boolean).join(' ');

              const lines = tasks.map(i => {
                const mentions = i.assignees.map(a => {
                  const id = discordMap[a.login];
                  return id ? `<@${id}>` : `@${a.login}`;
                }).join(' ');
                return `• [#${i.number}](${i.html_url}) ${i.title}\n   ${mentions}`;
              }).join('\n\n');

              return {
                content: pings || null,
                embeds: [{
                  title: `${emoji} ${title} (${tasks.length})`,
                  description: lines,
                  color: 3447003
                }]
              };
            };

            const send = async (url, payload) => {
              if (!url) return;
              await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
              });
            };

            const frontend = issues.filter(i => i.assignees && i.assignees.length > 0 && i.labels.some(l => l.name.toLowerCase().match(/front|interface|ui|ux/)));
            const backend = issues.filter(i => i.assignees && i.assignees.length > 0 && i.labels.some(l => l.name.toLowerCase().match(/back|core|api|server/)));
            const banco = issues.filter(i => i.assignees && i.assignees.length > 0 && i.labels.some(l => l.name.toLowerCase().match(/banco|db|dados|database/)));

            await send(process.env.DISCORD_FRONTEND, createPayload("🚀", "Frontend Interface", frontend));
            await send(process.env.DISCORD_BACKEND, createPayload("🔧", "Backend Core", backend));
            await send(process.env.DISCORD_BANCO, createPayload("🗄️", "Banco de Dados", banco));
