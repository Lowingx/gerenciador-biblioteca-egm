name: GBE - Alertas Diários de Tarefas por Team

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  issues: read
  pull-requests: read

jobs:
  daily-alerts:
    runs-on: ubuntu-latest
    steps:
      - name: Enviar alertas diários por time
        uses: actions/github-script@v7
        env:
          DISCORD_FRONTEND: ${{ secrets.DISCORD_FRONTEND }}
          DISCORD_BACKEND: ${{ secrets.DISCORD_BACKEND }}
          DISCORD_BANCO: ${{ secrets.DISCORD_BANCO }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = 'Lowingx';
            const repo = 'gerenciador-biblioteca-egm';
            const sevenDaysAgo = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000);

            const { data: issues } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', per_page: 100
            });

            const realIssues = issues.filter(i => !i.pull_request);
            console.log(`Issues encontradas: ${realIssues.length}`);

            const categories = [
              { name: "Frontend", regex: /front|interface|ui|ux|css|react/i, webhook: process.env.DISCORD_FRONTEND, color: 3447003 },
              { name: "Backend",  regex: /back|core|api|server|fastapi|python/i, webhook: process.env.DISCORD_BACKEND, color: 3066993 },
              { name: "Banco",    regex: /banco|db|dados|database|sql|postgres/i, webhook: process.env.DISCORD_BANCO,   color: 10181046 }
            ];

            for (const cat of categories) {
              if (!cat.webhook) continue;

              const catTasks = realIssues.filter(i => i.labels.some(l => l.name.match(cat.regex)));
              if (catTasks.length === 0) continue;

              const staleTasks = catTasks.filter(i => new Date(i.updated_at) < sevenDaysAgo);
              const activeTasks = catTasks.filter(i => new Date(i.updated_at) >= sevenDaysAgo);

              const formatList = (list) => {
                if (list.length === 0) return "✅ Nenhuma tarefa.";
                return list.slice(0, 5).map(i => {
                  // Limpa a descrição: remove quebras de linha e limita a 80 caracteres
                  const cleanBody = i.body ? i.body.replace(/\s+/g, ' ').substring(0, 80) + '...' : 'Sem descrição.';
                  return `**#${i.number}** [${i.title}](${i.html_url})\n> ${cleanBody}`;
                }).join('\n\n');
              };

              const payload = {
                embeds: [{
                  title: `🚀 Daily Report: ${cat.name}`,
                  color: cat.color,
                  fields: [
                    { name: "🔥 Urgente (+7 dias)", value: formatList(staleTasks) },
                    { name: "🛠️ Em andamento", value: formatList(activeTasks) }
                  ],
                  timestamp: new Date().toISOString()
                }]
              };

              try {
                const response = await fetch(cat.webhook, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify(payload)
                });
                if (!response.ok) throw new Error(`Status ${response.status}`);
                console.log(`✅ Enviado para ${cat.name}`);
              } catch (e) {
                console.log(`❌ Erro em ${cat.name}: ${e.message}`);
              }
            }
