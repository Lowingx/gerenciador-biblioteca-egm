name: GBE - Alertas Diários de Tarefas por Team

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  issues: read
  pull-requests: read

jobs:
  daily-alerts:
    runs-on: ubuntu-latest
    steps:
      - name: Enviar alertas diários por time
        uses: actions/github-script@v7
        env:
          DISCORD_FRONTEND: ${{ secrets.DISCORD_FRONTEND }}
          DISCORD_BACKEND: ${{ secrets.DISCORD_BACKEND }}
          DISCORD_BANCO: ${{ secrets.DISCORD_BANCO }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = 'Lowingx';
            const repo = 'gerenciador-biblioteca-egm';
            const sevenDaysAgo = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000);

            const { data: issues } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', per_page: 50, sort: 'updated'
            });

            const realIssues = issues.filter(i => !i.pull_request);

            const categories = [
              { name: "Frontend Interface", regex: /front|interface|ui|ux|css|react/i, webhook: process.env.DISCORD_FRONTEND, color: 0x3498db, emoji: "🎨" },
              { name: "Backend Core",       regex: /back|core|api|server|fastapi|python/i, webhook: process.env.DISCORD_BACKEND, color: 0x2ecc71, emoji: "⚙️" },
              { name: "Banco de Dados",     regex: /banco|db|dados|database|sql|postgres/i, webhook: process.env.DISCORD_BANCO,   color: 0x9b59b6, emoji: "🗄️" }
            ];

            const formatTasks = (tasks) => {
              if (tasks.length === 0) return "✅ *Tudo limpo por aqui!*";
              return tasks.slice(0, 5).map(i => {
                // Pega os primeiros 100 caracteres da descrição e remove quebras de linha extras
                const desc = i.body ? i.body.replace(/[\r\n]+/g, ' ').substring(0, 100).trim() + "..." : "Sem descrição.";
                return `🔹 **[#${i.number}](${i.html_url}) ${i.title}**\n> 📝 ${desc}`;
              }).join('\n\n');
            };

            for (const cat of categories) {
              if (!cat.webhook) continue;

              const catTasks = realIssues.filter(i => i.labels.some(l => l.name.match(cat.regex)));
              if (catTasks.length === 0) continue;

              const staleTasks = catTasks.filter(i => new Date(i.updated_at) < sevenDaysAgo);
              const activeTasks = catTasks.filter(i => new Date(i.updated_at) >= sevenDaysAgo);

              const embed = {
                title: `${cat.emoji} Report Diário: ${cat.name}`,
                color: cat.color,
                description: `Resumo das atividades pendentes para o time de ${cat.name}.`,
                fields: [
                  {
                    name: `⚠️ URGENTE (Parado há +7 dias)`,
                    value: formatTasks(staleTasks),
                    inline: false
                  },
                  {
                    name: `🕒 EM ANDAMENTO`,
                    value: formatTasks(activeTasks),
                    inline: false
                  }
                ],
                footer: { text: `Engine EGM • ${catTasks.length} tarefas no total` },
                timestamp: new Date().toISOString()
              };

              try {
                await fetch(cat.webhook, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ embeds: [embed] })
                });
                console.log(`✅ Alerta estilizado enviado para ${cat.name}`);
              } catch (err) {
                console.error(`❌ Erro: ${err.message}`);
              }
            }
