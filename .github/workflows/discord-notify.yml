name: Discord Notifications

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
    types: [opened, synchronize, closed]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v42

      - name: Frontend Notification
        if: contains(steps.changed-files.outputs.all_changed_files, 'frontend/')
        uses: sarisia/actions-status-discord@v1
        with:
          webhook_url: ${{ secrets.DISCORD_FRONTEND_WEBHOOK }}
          title: "🚀 Frontend Alterado"
          description: |
            Branch: `${{ github.ref_name }}`
            Autor: `${{ github.actor }}`
            Commit: ${{ github.event.head_commit.message }}

      - name: Backend Notification
        if: contains(steps.changed-files.outputs.all_changed_files, 'backend/')
        uses: sarisia/actions-status-discord@v1
        with:
          webhook_url: ${{ secrets.DISCORD_BACKEND_WEBHOOK }}
          title: "🔧 Backend Alterado"
          description: |
            Branch: `${{ github.ref_name }}`
            Autor: `${{ github.actor }}`
            Commit: ${{ github.event.head_commit.message }}

      - name: PR Notification
        if: github.event_name == 'pull_request'
        uses: sarisia/actions-status-discord@v1
        with:
          webhook_url: ${{ secrets.DISCORD_PR_WEBHOOK }}
          title: "📋 Pull Request ${{ github.event.action }}"
          description: |
            Título: **${{ github.event.pull_request.title }}**
            Autor: `${{ github.event.pull_request.user.login }}`
            Link: ${{ github.event.pull_request.html_url }}
